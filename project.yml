name: CapturePlus
options:
  bundleIdPrefix: com.joh
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  CapturePlus:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: "Capture +"
        CFBundleDisplayName: "Capture +"
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "7"
        NSMicrophoneUsageDescription: "Capture + records your microphone when you enable it for a screen recording."
        NSHumanReadableCopyright: "Personal utility. Not for distribution."
        # Sparkle in-app updates. The feed is generated by scripts/release.sh.
        SUFeedURL: "https://raw.githubusercontent.com/LyJohnny/capture-plus/main/appcast.xml"
        SUPublicEDKey: "uMwdiw8rfDwaeZnJ3Ql4TPsbIRRLh3+lMSw07EgQ0DE="
        SUEnableAutomaticChecks: true
    entitlements:
      path: Resources/CapturePlus.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Hardened runtime (required for notarization) blocks mic access without this.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: "Capture +"
        PRODUCT_BUNDLE_IDENTIFIER: com.joh.captureplus
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: BDU36H5583
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        ENABLE_HARDENED_RUNTIME: true
        # Xcode otherwise injects get-task-allow (debugger attach), which Apple's
        # notary service rejects.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: true
        COMBINE_HIDPI_IMAGES: true
